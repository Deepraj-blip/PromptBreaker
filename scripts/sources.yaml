# Sources for the payload aggregator. Add new sources here without touching
# the fetch script itself. Each source needs:
#   name: unique identifier, used in dedup provenance tracking
#   url: raw-content URL (GitHub raw, not the HTML page)
#   parser: which parser function in fetch_and_build.py to use
#   category: jailbreak | exfil | override | encoding | (blank = infer from content)
#
# NOTE: URLs below need to be verified/updated against the live repos before
# the cron job is enabled - upstream repos restructure occasionally and a
# stale path should fail loudly (the script errors per-source, not globally)
# rather than silently returning nothing.

sources:
  # NOTE: garak's DAN probes moved their prompt text out of dan.py into
  # external JSON data files (path not yet verified against the current
  # repo layout - garak/data/... per their XDG-style data dir convention).
  # Leaving this source commented out rather than silently returning 0
  # results. To enable: find the real path (browse
  # https://github.com/NVIDIA/garak/tree/main/garak/data), point this at
  # the raw JSON file, and switch parser to parse_json_array.
  # - name: garak-dan-probes
  #   url: <verify-path>/garak/data/dan/<file>.json
  #   parser: parse_json_array
  #   category: jailbreak

  - name: garak-encoding-probes
    url: https://raw.githubusercontent.com/NVIDIA/garak/main/garak/probes/encoding.py
    parser: parse_garak_python_module
    category: encoding

  # REMOVED garak-continuation-probes: continuation.py builds its prompts at
  # runtime from an external slurprompts.jsonl (no static list to parse), and
  # its content is hate-speech slur completion — not prompt injection. It
  # fetched 0 usable payloads. Removed rather than left failing.
  #
  # REMOVED owasp-llm-top10-doc: LLM01_PromptInjection.md is explanatory prose
  # (Description/Prevention), not a bank of copy-paste payloads, so the
  # payload-vs-prose filter correctly rejected all of it (0 yield). Removed.

  - name: payloadsallthethings-prompt-injection
    url: https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/master/Prompt%20Injection/README.md
    parser: parse_markdown_code_blocks
    category: null   # inferred per-block from surrounding heading text

  # verazuo/jailbreak_llms — the "In-The-Wild Jailbreak Prompts" dataset
  # (CCS'24). A large CSV of real jailbreak prompts collected from Discord,
  # Reddit, etc. The 'prompt' column holds the payload. Capped (see limit) so
  # this curated list stays tight; harmful-compliance entries auto-route to
  # payloads/risky/ at ingestion, and global dedup + top-N ranking sort the
  # strongest cross-source payloads to the top regardless of which slice we
  # take. To widen coverage later, raise or remove `limit`.
  - name: verazuo-jailbreaks
    url: https://raw.githubusercontent.com/verazuo/jailbreak_llms/main/data/prompts/jailbreak_prompts_2023_12_25.csv
    parser: parse_csv_column
    category: jailbreak
    limit: 300

  # 0xk1h0/ChatGPT_DAN — a well-known, actively-referenced collection of DAN
  # ("Do Anything Now") and other persona/roleplay jailbreak prompts, in
  # markdown code blocks.
  - name: chatgpt-dan
    url: https://raw.githubusercontent.com/0xk1h0/ChatGPT_DAN/main/README.md
    parser: parse_markdown_code_blocks
    category: jailbreak

  # reshabhs/SPML_Chatbot_Prompt_Injection — a labeled chatbot prompt-injection
  # dataset. Category-specific bulk source for the otherwise-thin override and
  # exfil buckets: parse_spml_injections keeps only short, payload-shaped real
  # injections (dropping scaffolding, cover-story bloat, and mojibake), and
  # content classification files each as override/exfil/jailbreak. Capped for a
  # curated list; the underlying dataset is synthetic, so we take a tight slice.
  - name: spml-chatbot-injections
    url: https://huggingface.co/datasets/reshabhs/SPML_Chatbot_Prompt_Injection/resolve/main/spml_prompt_injection.csv
    parser: parse_spml_injections
    category: null
    limit: 60

  # Organized by the document's own ## headers per model (ChatGPT, Claude,
  # Llama2, Gemini2.0, Grok3, DeepSeek), plus a "LLM System Prompts
  # Leaking" section. Mostly persona/roleplay guardrail-testing prompts,
  # but the raw file also contains some harmful-compliance entries
  # (malware/weapon/etc. generation). Those are dropped at ingestion by
  # is_harmful_compliance() per the README exclusion policy;
  # category/model are determined per-entry by
  # parse_markdown_by_model_sections from the document's own ## headings.
  - name: langgptai-llm-jailbreaks
    url: https://raw.githubusercontent.com/langgptai/LLM-Jailbreaks/main/README.md
    parser: parse_markdown_by_model_sections
    category: null
    model: null

  # Add more here, e.g.:
  # - name: promptfoo-redteam-jailbreak
  #   url: https://raw.githubusercontent.com/promptfoo/promptfoo/main/<path-to-plugin-data>
  #   parser: parse_json_array
  #   category: jailbreak
